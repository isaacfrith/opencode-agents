version: 2

models:
  - name: fct_weather__daily
    description: "Current forecast per (location, forecast day) — latest snapshot wins."
    columns:
      - name: location_name
        tests: [not_null]
      - name: forecast_date
        tests: [not_null]
      - name: temperature_max_c
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -50
                max_value: 60
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - location_name
              - forecast_date
