[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Extract live weather forecasts from Open-Meteo, land them raw in DuckDB, transform to daily tabular data with dbt"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["extract"]
