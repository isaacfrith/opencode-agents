<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Churn scorer</title>
  <style>
    :root { --ink:#1b1b1f; --muted:#6b6b76; --line:#e3e3e8; --accent:#2f6feb; --bg:#f7f7f9; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           color:var(--ink); background:var(--bg); }
    main { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 28px; }
    form { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px;
           display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
    input, select { font:inherit; color:var(--ink); padding:8px 10px; border:1px solid var(--line);
                    border-radius:8px; background:#fff; }
    input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
    button { grid-column:1 / -1; margin-top:4px; padding:11px 16px; font:inherit; font-weight:600;
             color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:progress; }
    #result { grid-column:1 / -1; margin-top:4px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-top:20px; }
    .score { font-size:34px; font-weight:700; }
    .flag { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; }
    .yes { background:#fde8e8; color:#a11212; }
    .no  { background:#e8f5ec; color:#12692f; }
    .muted { color:var(--muted); font-size:13px; }
    .err { color:#a11212; }
    @media (max-width:560px) { form { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Churn scorer</h1>
  <p class="sub">Enter a customer to get their churn score from the current <code>@champion</code> model.</p>

  <form id="f">
    <label>Credit score <input name="credit_score" type="number" value="645" min="300" max="900" required /></label>
    <label>Geography
      <select name="geography"><option>France</option><option>Germany</option><option selected>Spain</option></select>
    </label>
    <label>Gender
      <select name="gender"><option selected>Male</option><option>Female</option></select>
    </label>
    <label>Age <input name="age" type="number" value="44" min="18" max="100" required /></label>
    <label>Tenure (years) <input name="tenure" type="number" value="8" min="0" max="10" required /></label>
    <label>Balance <input name="balance" type="number" step="0.01" value="113755.78" min="0" required /></label>
    <label>Products <input name="num_of_products" type="number" value="2" min="1" max="4" required /></label>
    <label>Has credit card
      <select name="has_cr_card"><option value="1" selected>Yes</option><option value="0">No</option></select>
    </label>
    <label>Active member
      <select name="is_active_member"><option value="1" selected>Yes</option><option value="0">No</option></select>
    </label>
    <label>Estimated salary <input name="estimated_salary" type="number" step="0.01" value="112542.58" min="0" required /></label>
    <button type="submit">Score customer</button>
  </form>

  <div id="result"></div>
</main>

<script>
  const form = document.getElementById("f");
  const out = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    out.innerHTML = '<p class="muted">Scoring…</p>';
    const data = Object.fromEntries(new FormData(form).entries());
    for (const k of ["credit_score","age","tenure","num_of_products","has_cr_card","is_active_member"]) {
      data[k] = parseInt(data[k], 10);
    }
    for (const k of ["balance","estimated_salary"]) data[k] = parseFloat(data[k]);
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail ? JSON.stringify(err.detail) : res.statusText);
      }
      const p = await res.json();
      const pct = (p.churn_score * 100).toFixed(1);
      out.innerHTML = `
        <div class="card">
          <div class="score">${pct}%</div>
          <div class="muted">churn score</div>
          <div class="flag ${p.predicted_churn ? "yes" : "no"}">
            ${p.predicted_churn ? "Predicted to churn" : "Predicted to stay"}
          </div>
          <div class="muted" style="margin-top:12px">
            threshold ${p.threshold.toFixed(3)} · model v${p.model_version}
          </div>
        </div>`;
    } catch (err) {
      out.innerHTML = `<p class="err">Could not score: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
